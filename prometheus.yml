global:
  scrape_interval: 15s
  evaluation_interval: 1m

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'workflow-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['workflow-app:3000']
